project:
  name: Job Radar Assistant
  mode: local_personal_use

targets:
  roles:
    - Junior Software Engineer
    - New Grad Software Engineer
    - Entry-Level Software Developer
    - Application Developer
    - Frontend Developer
    - Full-stack Developer
    - Java Developer
    - React TypeScript Developer
    - Junior AWS Cloud Developer
  locations:
    - Minnesota
    - Twin Cities
    - Rochester
    - Remote
    - Hybrid nearby

penalties:
  keywords:
    - senior
    - staff
    - principal
    - lead
    - architect
    - manager
    - 5+ years
    - contract only
    - unpaid

safety:
  auto_apply: false
  browser_automation_enabled: false
  ai_scoring_enabled: false

discord:
  enabled: false
  commands:
    - status
    - help
    - test-notification
  application_actions_enabled: false
